<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rikkei Coffee - Promotion</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <!-- Khối ưu đãi chính -->
        <section class="block">
            <h1>Ưu đãi tháng này</h1>
            <!-- Thẻ ưu đãi 1 -->
            <section class="box">
                <div class="label">Giảm 20%</div>
                <h2>Combo cà phê sáng</h2>
                <p>Một cà phê sữa và một bánh mì que, áp dụng từ 7:00 đến 10:00.</p>
                <a href="#"  class="button">Nhận ưu đãi</a>
            </section>
            <!-- Thẻ ưu đãi 2 -->
            <section class="box">
                <div class="label">Mua 1 tặng 1</div>
                <h2>Trà đào cam sả buổi chiều</h2>
                <p>Áp dụng cho ly cỡ M, từ 14:00 đến 17:00 các ngày trong tuần.</p>
                <a href="#"  class="button">Nhận ưu đãi</a>
            </section>
        </section>
    </main>
</body>
</html>
